[metadata]
name = irp
version = 0.1.0-dev0
author = Emotive Academy
author_email = info+irp@emotive.academy
description = An open-source, modular capacity expansion and techno-economic optimization framework for electricity grid planning
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Emotive-Academy/irp
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.26.0
    scipy>=1.12.0
    pandas>=2.2.0
    matplotlib>=3.8.0

[options.packages.find]
where = src

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info
